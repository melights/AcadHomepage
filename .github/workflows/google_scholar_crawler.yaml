name: Get Citation Data

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/google_scholar_crawler.yaml
      - google_scholar_crawler/**
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install and check crawler dependencies
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt
          python -m pip check
          python -c "from scholarly import scholarly, ProxyGenerator"

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: google-scholar-stats
      cancel-in-progress: false
    defaults:
      run:
        working-directory: google_scholar_crawler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch citation data
        run: |
          if [ -z "$GOOGLE_SCHOLAR_ID" ]; then
            echo "::error::Set the GOOGLE_SCHOLAR_ID repository secret."
            exit 1
          fi
          python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
